name: numbers-dont-lie

services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATA_FILE: /app/data/numbers-dont-lie.db
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:27450}
      DEEPSEEK_ENV_FILE: /run/secrets/deepseek_env
      AUTH_JWT_SECRET_FILE: /app/data/jwt-secret
      RESEND_API_KEY_FILE: /app/data/resend.key
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Haleview <onboarding@resend.dev>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET_FILE: /app/data/google-client-secret
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:27451/api/auth/oauth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET_FILE: /app/data/github-client-secret
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://127.0.0.1:27451/api/auth/oauth/github/callback}
    secrets:
      - deepseek_env
    volumes:
      - ./backend/data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-27451}:3001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-27450}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

secrets:
  deepseek_env:
    file: ${DEEPSEEK_ENV_FILE:-./.env.example}
