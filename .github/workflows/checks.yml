name: Checks

on:
  push:
    branches: [main, numbers-dont-lie, counting-calories, ai-assistant]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify backend
        run: docker build --target build --tag haleview-backend-check ./backend
      - name: Verify frontend
        run: docker build --target build --tag haleview-frontend-check ./frontend
