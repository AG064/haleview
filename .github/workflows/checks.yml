name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify backend
        run: docker build --target build --tag haleview-backend-check ./backend
      - name: Verify frontend
        run: docker build --target build --tag haleview-frontend-check ./frontend
